<!doctype html>
<html lang="en" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP Client — preview</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="dist/main.css" />
  </head>
  <body class="vscode-dark">
    <div id="app"></div>
    <script>
      // ?theme=light switches to the light theme variables.
      if (new URLSearchParams(location.search).get('theme') === 'light') {
        document.documentElement.className = 'theme-light';
        document.body.className = 'vscode-light';
      }
    </script>
    <script src="dist/main.js"></script>
    <script>
      // Live reload when `npm run preview` rebuilds.
      if (!new URLSearchParams(location.search).has('shot')) new EventSource('/reload').addEventListener('change', () => location.reload());
    </script>
  </body>
</html>
