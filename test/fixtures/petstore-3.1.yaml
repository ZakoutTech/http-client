openapi: 3.1.0
info:
  title: Petstore 3.1
  version: 1.0.0
servers:
  - url: https://{env}.example.com/api/v3
    variables:
      env:
        default: petstore
tags:
  - name: pets
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    machine:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            pets.read: read pets
  schemas:
    Pet:
      type: [object]
      required: [name]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: doggie
        tags:
          type: array
          items:
            type: string
        parent:
          oneOf:
            - $ref: '#/components/schemas/Pet'
            - type: 'null'
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: ok
    post:
      tags: [pets]
      summary: Create pet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
          example: '42'
    get:
      tags: [pets]
      summary: Get pet
      responses:
        '200':
          description: ok
    delete:
      tags: [pets]
      summary: Delete pet (public)
      security: []
      responses:
        '204':
          description: deleted
  /reports:
    get:
      tags: [reports]
      summary: Machine report
      security:
        - machine: [pets.read]
      responses:
        '200':
          description: ok
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: ok
